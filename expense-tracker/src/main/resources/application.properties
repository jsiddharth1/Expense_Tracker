# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-197da4df-jamalpursiddharth0-36d7.a.aivencloud.com:21179/defaultdb?ssl-mode=REQUIRED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Initialize data.sql after Hibernate creates/updates tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Server — Render injects PORT env var; fall back to 8081 locally
server.port=${PORT:8081}

# Thymeleaf
spring.thymeleaf.check-template-location=false
